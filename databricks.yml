bundle:
  name: whs-rag

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog
    default: workspace
  schema:
    description: Schema holding the volume, tables and index
    default: rag_demo
  git_commit:
    description: Commit being deployed; CI passes it with --var so eval runs trace back to a commit
    default: local

targets:
  dev:
    mode: development
    default: true
