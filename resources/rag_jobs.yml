# No cluster settings: tasks run on serverless (the only compute in Free Edition).
resources:
  jobs:
    ingest_job:
      name: whs-rag-ingest
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/01_ingest.py
        - task_key: index
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/02_index.py

    eval_job:
      name: whs-rag-eval
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: git_commit
          default: ${var.git_commit}
      tasks:
        - task_key: evaluate
          notebook_task:
            notebook_path: ../notebooks/03_rag_eval.py
